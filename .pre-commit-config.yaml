repos:
  - repo: local
    hooks:
      # Add ty hook
      - id: ty-hook
        name: Type Checking
        description: This hook runs type checking
        entry: bash -c 'git ls-files -z "*.py" | xargs -0 uvx pyrefly check --summarize-errors'
        language: system
        types: [python]
        pass_filenames: false

      # Add ruff hook
      - id: ruff-hook
        name: Ruff Linting
        description: This hook runs linting with Ruff
        entry: uvx ruff
        language: system
        types: [python]
        args: ["check", "--fix"]