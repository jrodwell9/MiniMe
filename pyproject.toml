[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikiskill"
version = "0.1.0"
description = "Self-evolving skill harness and pattern wiki for Claude Code agent sessions"
readme = "src/wikiskill/README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.31.0",
    "arxiv>=2.1.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.100.0",
    "dspy>=3.4.1",
    "commitizen>=4.19.3",
]

[project.scripts]
wikiskill = "wikiskill.cli:main"
wikiskill-harness = "wikiskill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wikiskill"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
    "src/**/*.py",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.14.13",
    "ty>=0.0.12",
]
