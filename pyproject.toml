[project]
name = "minime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "wikiskill",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
wikiskill = { workspace = true }

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.13",
    "ty>=0.0.12",
]
