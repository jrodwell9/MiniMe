[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikiskill"
version = "0.1.0"
description = "Self-evolving skill harness and pattern wiki for Claude Code agent sessions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.31.0",
    "arxiv>=2.1.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.100.0",
]

[project.scripts]
wikiskill = "wikiskill.cli:main"
wikiskill-harness = "wikiskill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wikiskill"]
